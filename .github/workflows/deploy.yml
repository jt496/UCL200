name: Deploy Doughnut to GitHub Pages

on:
  push:
    branches:
      - main # Change this if your default branch is different

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: doughnut/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: doughnut

      - name: Build
        run: npm run build
        working-directory: doughnut

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare site structure
        run: |
          mkdir -p site/doughnut
          cp -r doughnut/dist/* site/doughnut/
          # Add a simple redirect at the root
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=doughnut/"></head><body>Redirecting to <a href="doughnut/">doughnut/</a></body></html>' > site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
