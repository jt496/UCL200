<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Torus — add/remove points</title>
  <style>
    body{margin:0;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial}
    canvas{display:block}
    #ui{position:fixed;left:8px;top:8px;background:rgba(0,0,0,0.6);color:#fff;padding:8px;border-radius:6px;z-index:9999}
    #msg{font-size:13px;margin-top:6px}
    button{margin-right:6px}
    #exportArea{width:300px;height:120px;margin-top:6px;font-size:12px}
  </style>
  <script type="importmap">
  {"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js"}}
  </script>
</head>
<body>
  <div id="ui">
    <div><strong>Interactive Torus</strong></div>
    <div id="msg">Click the torus to add a point. Click a point to remove it.</div>
    <div style="margin-top:6px">
      <button id="clear">Clear all</button>
      <button id="export">Copy coords</button>
    </div>
    <textarea id="exportArea" readonly placeholder="Coordinates will appear here after export"></textarea>
  </div>

  <script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111117);
  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(0,0,8);
  const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio||1); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.dampingFactor=0.08;

  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  const dl = new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(5,8,6); scene.add(dl);

  // Torus geometry
  const R = 3, r = 1.1;
  const torusGeom = new THREE.TorusGeometry(R, r, 64, 128);
  const torusMat = new THREE.MeshPhongMaterial({color:0x3366aa, side:THREE.DoubleSide, transparent:true, opacity:0.5});
  const torus = new THREE.Mesh(torusGeom, torusMat); scene.add(torus);

  // groups for markers
  const markers = [];
  const markersGroup = new THREE.Group(); scene.add(markersGroup);
  const labelsGroup = new THREE.Group(); scene.add(labelsGroup);
  const edgesGroup = new THREE.Group(); scene.add(edgesGroup);
  let edgesData = [];

  const raycaster = new THREE.Raycaster(); const pointer = new THREE.Vector2();
  const interactive = false; // when false, clicking the 3D view won't add/remove markers

  function pointToUV(p){
    // p is THREE.Vector3 on torus surface. Recover (u,v)
    const u = Math.atan2(p.y, p.x);
    const cx = R * Math.cos(u), cy = R * Math.sin(u);
    const vx = p.x - cx, vy = p.y - cy;
    const radial = Math.sqrt(vx*vx + vy*vy);
    const v = Math.atan2(p.z, radial);
    // normalize to [0,1)
    let s = (u / (2*Math.PI)) % 1; if(s<0) s+=1;
    let t = (v / (2*Math.PI) + 0.5) % 1; if(t<0) t+=1;
    return {u, v, s, t};
  }

  function addMarkerAt(point, id=null){
    const geom = new THREE.SphereGeometry(0.2, 18, 18);
    const mat = new THREE.MeshPhongMaterial({color:0xff4444});
    const m = new THREE.Mesh(geom, mat); m.position.copy(point);
    markersGroup.add(m);
    const uv = pointToUV(point);
    if(id !== null) uv.id = id;
    const marker = {mesh:m, pos:point.clone(), uv, label: null};
    // create numeric label sprite
    if(uv && uv.id !== undefined){
      const sprite = createLabelSprite(String(uv.id));
      labelsGroup.add(sprite);
      marker.label = sprite;
      placeLabel(sprite, marker.pos);
    }
    markers.push(marker);
    updateMsg();
  }

  function createLabelSprite(text){
    const size = 128;
    const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.lineWidth = 6;
    ctx.font = 'bold 72px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // draw outline
    ctx.strokeText(text, size/2, size/2);
    ctx.fillStyle = '#003344'; ctx.fillText(text, size/2, size/2);
    const tex = new THREE.CanvasTexture(canvas); tex.needsUpdate = true;
    const mat = new THREE.SpriteMaterial({map:tex, transparent:true});
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(0.6,0.6,1);
    return sprite;
  }

  function placeLabel(sprite, pos){
    // compute torus tube normal at pos: center circle point
    const x = pos.x, y = pos.y, z = pos.z;
    const rho = Math.sqrt(x*x + y*y);
    const cx = (rho === 0) ? 0 : (R * x / rho);
    const cy = (rho === 0) ? 0 : (R * y / rho);
    const center = new THREE.Vector3(cx, cy, 0);
    const normal = new THREE.Vector3().subVectors(pos, center).normalize();
    const labelPos = new THREE.Vector3().copy(pos).addScaledVector(normal, 0.28);
    sprite.position.copy(labelPos);
  }

  // Map (s,t) in [0,1) to 3D torus point
  function paramTo3D(u,v){ return new THREE.Vector3((R + r*Math.cos(v))*Math.cos(u), (R + r*Math.cos(v))*Math.sin(u), r*Math.sin(v)); }

  // Load initial markers from localStorage (if any)
  try{
    const raw = localStorage.getItem('torus_points');
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)){
        for(const item of arr){
          const s = (item.s !== undefined) ? item.s : (item.u !== undefined ? (item.u/(2*Math.PI)) : null);
          const t = (item.t !== undefined) ? item.t : (item.v !== undefined ? (item.v/(2*Math.PI)+0.5) : null);
            if(s!==null && t!==null){
              const u = s * 2*Math.PI;
              const v = (t - 0.5) * 2*Math.PI;
              const p = paramTo3D(u,v);
              // preserve id if present in saved points
              const id = (item.id !== undefined) ? item.id : null;
              addMarkerAt(p, id);
          }
        }
        // optionally remove to avoid reloading next time
        localStorage.removeItem('torus_points');
      }
    }
  }catch(e){console.warn('Failed to load torus_points', e)}

  // Load edges from localStorage and store edgesData for later re-creation
  try{
    const rawE = localStorage.getItem('torus_edges');
    if(rawE){
      const arr = JSON.parse(rawE);
      if(Array.isArray(arr)){
        edgesData = arr;
      }
      localStorage.removeItem('torus_edges');
    }
  }catch(e){console.warn('Failed to load torus_edges', e)}

  // Build edgesGroup from edgesData and current markers
  function rebuildEdges(){
    // clear existing
    while(edgesGroup.children.length){ const c = edgesGroup.children[0]; edgesGroup.remove(c); if(c.geometry) c.geometry.dispose(); if(c.material) c.material.dispose(); }
    if(!edgesData || !Array.isArray(edgesData)) return;
    for(const ee of edgesData){
      let a_s=null,a_t=null,b_s=null,b_t=null; let maRef=null, mbRef=null;
      if(ee.a && typeof ee.a === 'object'){ a_s = ee.a.s; a_t = ee.a.t; }
      if(ee.b && typeof ee.b === 'object'){ b_s = ee.b.s; b_t = ee.b.t; }
      if((a_s===null || b_s===null)){
        if(ee.a !== undefined){ const ma = markers.find(m=> m.uv && m.uv.id === ee.a); if(ma){ a_s = ma.uv.s; a_t = ma.uv.t; maRef = ma; } }
        if(ee.b !== undefined){ const mb = markers.find(m=> m.uv && m.uv.id === ee.b); if(mb){ b_s = mb.uv.s; b_t = mb.uv.t; mbRef = mb; } }
      }
      if(a_s!==null && b_s!==null){
        const segs = edgeToSegmentList(a_s,a_t,b_s,b_t, ee);
        if(segs.length>0 && maRef){ segs[0].opts = segs[0].opts || {}; segs[0].opts.forceStartPos = maRef.pos; }
        if(segs.length>0 && mbRef){ segs[segs.length-1].opts = segs[segs.length-1].opts || {}; segs[segs.length-1].opts.forceEndPos = mbRef.pos; }
        for(let si=0; si<segs.length; si++){ const s = segs[si]; createEdgeFromST(s.s0,s.t0,s.s1,s.t1, {radius:0.045, color:0xffd24d, direct: !!(s.opts && s.opts.direct), forceStartPos: s.opts && s.opts.forceStartPos, forceEndPos: s.opts && s.opts.forceEndPos}); }
      }
    }
  }

  // After initial marker creation, rebuild edges so they get created once markers exist
  rebuildEdges();

  function removeMarker(mesh){
    const idx = markers.findIndex(x=>x.mesh===mesh);
    if(idx>=0){ markersGroup.remove(mesh); markers[idx].mesh.geometry.dispose(); markers[idx].mesh.material.dispose(); markers.splice(idx,1); updateMsg(); }
  }

  // Save current markers (s,t and id) to localStorage
  function savePointsToLocalStorage(){
    try{
      const out = markers.map(m => ({s: m.uv.s, t: m.uv.t, id: m.uv.id}));
      localStorage.setItem('torus_points', JSON.stringify(out));
    }catch(e){ console.warn('Failed to save torus_points', e); }
  }

  // Drag support: click a marker to drag it along the torus surface
  let dragging = null;
  function startDrag(mesh, evt){
    const marker = markers.find(m=> m.mesh===mesh);
    if(!marker) return;
    dragging = marker;
    try{ renderer.domElement.setPointerCapture(evt.pointerId); }catch(e){}
  }

  function onPointerMove(evt){
    if(!dragging) return;
    pointer.x = (evt.clientX / innerWidth) * 2 - 1; pointer.y = - (evt.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(torus, false);
    if(hits.length>0){
      const pt = hits[0].point;
      dragging.mesh.position.copy(pt);
      dragging.pos.copy(pt);
      const newuv = pointToUV(pt);
      dragging.uv.s = newuv.s; dragging.uv.t = newuv.t; dragging.uv.u = newuv.u; dragging.uv.v = newuv.v;
      if(dragging.label) placeLabel(dragging.label, dragging.pos);
      // rebuild edges so endpoints update
      rebuildEdges();
    }
  }

  function onPointerUp(evt){
    if(!dragging) return;
    try{ renderer.domElement.releasePointerCapture(evt.pointerId); }catch(e){}
    // finalize and persist positions
    savePointsToLocalStorage();
    dragging = null;
  }

  // Create a smooth tube edge from flat torus coords (s,t) -> 3D
  function createEdgeFromST(s0,t0,s1,t1, opts={radius:0.045, color:0xffd24d, direct:false}){
    function wrapDelta(a,b){ let d = b - a; if(d > 0.5) d -= 1; if(d < -0.5) d += 1; return d; }
    let ds, dt;
    if(opts.direct){ ds = s1 - s0; dt = t1 - t0; }
    else { ds = wrapDelta(s0,s1); dt = wrapDelta(t0,t1); }
    const segments = 128; const pts = [];
    for(let k=0;k<=segments;k++){ const tt=k/segments; const s = s0 + tt*ds; const t = t0 + tt*dt; const u = s*2*Math.PI; const v = (t-0.5)*2*Math.PI; pts.push(paramTo3D(u,v)); }
    // Build a linear piecewise curve that passes exactly through the sampled pts
    class LinearPathCurve extends THREE.Curve {
      constructor(points){ super(); this.points = points; }
      getPoint(t){
        const pts = this.points; const n = pts.length;
        if(n===0) return new THREE.Vector3();
        if(t<=0) return pts[0].clone(); if(t>=1) return pts[n-1].clone();
        const total = n-1; const f = t * total; const idx = Math.floor(f); const localT = f - idx;
        const a = pts[idx]; const b = pts[idx+1];
        return new THREE.Vector3(a.x + (b.x-a.x)*localT, a.y + (b.y-a.y)*localT, a.z + (b.z-a.z)*localT);
      }
    }
    // If caller provided exact start/end 3D positions, snap endpoints to them so multiple edges meet exactly
    if(opts.forceStartPos && opts.forceStartPos.isVector3){ pts[0] = opts.forceStartPos.clone(); }
    if(opts.forceEndPos && opts.forceEndPos.isVector3){ pts[pts.length-1] = opts.forceEndPos.clone(); }
    const curve = new LinearPathCurve(pts);
    const geom = new THREE.TubeGeometry(curve, Math.max(32, pts.length*2), opts.radius, 8, false);
    const mat = new THREE.MeshPhongMaterial({color:opts.color});
    const mesh = new THREE.Mesh(geom, mat); mesh.renderOrder = 1; mesh.userData.path = pts; edgesGroup.add(mesh);
    return mesh;
  }

  // Given an edge object (possibly with mid or mids), return ordered list of segment endpoints [s0,t0,s1,t1, options]
  function edgeToSegmentList(a_s,a_t,b_s,b_t, ee){
    const segs = [];
    if(ee.mids && Array.isArray(ee.mids) && ee.mids.length===2){
      const m1 = ee.mids[0], m2 = ee.mids[1];
      // v -> m1 (shortest wrap)
      segs.push({s0:a_s,t0:a_t,s1:m1.s,t1:m1.t, opts:{direct:false}});
      // wrapped(m1) -> m2 (direct across square, don't wrap shortest)
      const m1w = (Math.abs(m1.s - 0) < 1e-6) ? {s:1,t:m1.t} : ((Math.abs(m1.s - 1) < 1e-6) ? {s:0,t:m1.t} : ((Math.abs(m1.t - 0) < 1e-6) ? {s:m1.s,t:1} : ((Math.abs(m1.t - 1) < 1e-6) ? {s:m1.s,t:0} : {s:m1.s,t:m1.t})));
      segs.push({s0:m1w.s,t0:m1w.t,s1:m2.s,t1:m2.t, opts:{direct:true}});
      // wrapped(m2) -> b (shortest wrap)
      const m2w = (Math.abs(m2.s - 0) < 1e-6) ? {s:1,t:m2.t} : ((Math.abs(m2.s - 1) < 1e-6) ? {s:0,t:m2.t} : ((Math.abs(m2.t - 0) < 1e-6) ? {s:m2.s,t:1} : ((Math.abs(m2.t - 1) < 1e-6) ? {s:m2.s,t:0} : {s:m2.s,t:m2.t})));
      segs.push({s0:m2w.s,t0:m2w.t,s1:b_s,t1:b_t, opts:{direct:false}});
      return segs;
    }
    if(ee.mid){
      const m = ee.mid;
      segs.push({s0:a_s,t0:a_t,s1:m.s,t1:m.t, opts:{direct:false}});
      const mw = (Math.abs(m.s - 0) < 1e-6) ? {s:1,t:m.t} : ((Math.abs(m.s - 1) < 1e-6) ? {s:0,t:m.t} : ((Math.abs(m.t - 0) < 1e-6) ? {s:m.s,t:1} : ((Math.abs(m.t - 1) < 1e-6) ? {s:m.s,t:0} : {s:m.s,t:m.t})));
      segs.push({s0:mw.s,t0:mw.t,s1:b_s,t1:b_t, opts:{direct:false}});
      return segs;
    }
    // simple edge
    segs.push({s0:a_s,t0:a_t,s1:b_s,t1:b_t, opts:{direct:false}});
    return segs;
  }

  function updateMsg(){ document.getElementById('msg').textContent = `Markers: ${markers.length} — click torus to add, click marker to remove.`; }

  function onPointerDown(evt){
    pointer.x = (evt.clientX / innerWidth) * 2 - 1; pointer.y = - (evt.clientY / innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    // first check markers -> start dragging even when viewer is non-interactive
    const hitsMarkers = raycaster.intersectObjects(markersGroup.children, false);
    if(hitsMarkers.length>0){ startDrag(hitsMarkers[0].object, evt); return; }
    if(!interactive) return; // other interactions (add/remove) disabled when interactive=false
    // else check torus for adding/removing when interactive
    const hits = raycaster.intersectObject(torus, false);
    if(hits.length>0){ addMarkerAt(hits[0].point); }
  }

  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  renderer.domElement.addEventListener('pointercancel', onPointerUp);

  window.addEventListener('resize', ()=>{ camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

  document.getElementById('clear').addEventListener('click', ()=>{ while(markersGroup.children.length) markersGroup.remove(markersGroup.children[0]); markers.length=0; updateMsg(); });
  document.getElementById('export').addEventListener('click', ()=>{
    const out = markers.map(m => ({s: m.uv.s, t: m.uv.t, u: m.uv.u, v: m.uv.v}));
    const txt = JSON.stringify(out, null, 2);
    const ta = document.getElementById('exportArea'); ta.value = txt;
    if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
  });

  function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  animate();
  </script>
</body>
</html>
