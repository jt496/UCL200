<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCL 200 - Mathematical Visualisations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161d;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text: #ffffff;
            --text-dim: #94a3b8;
            --grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-blob {
            position: fixed;
            width: 600px;
            height: 600px;
            background: var(--accent-glow);
            filter: blur(150px);
            border-radius: 50%;
            z-index: -1;
            top: -200px;
            left: -200px;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(300px, 300px); }
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            z-index: 1;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            margin: 0;
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-top: 1rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            max-width: 1000px;
            width: 90%;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2.5rem;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow);
        }

        .card h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            margin: 0 0 1rem 0;
        }

        .card p {
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 2rem;
            flex-grow: 1;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            background: var(--grad);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .btn.secondary:hover {
            background: var(--accent);
            color: white;
        }

        footer {
            margin-top: 5rem;
            color: var(--text-dim);
            font-size: 0.9rem;
            opacity: 0.5;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="background-blob"></div>
    
    <header>
        <h1>UCL 200</h1>
        <p class="subtitle">Interactive Mathematical Visualisations</p>
    </header>

    <main class="container">
        <div class="card">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 5 L90 50 L50 95 L10 50 Z" stroke="url(#penrose-grad)" stroke-width="6" fill="url(#penrose-grad)" fill-opacity="0.2"/>
                    <defs>
                        <linearGradient id="penrose-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#a855f7"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h2>Penrose Tilings</h2>
            <p>Explore the aperiodicity of Penrose tilings, Robinson tilings and more.</p>
            <div class="btn-group">
                <a href="penrose/penrose.html" class="btn secondary">Tiling Explorer</a>
                <a href="penrose/game.html" class="btn">Game</a>
            </div>
        </div>

        <div class="card">
            <div class="icon">🍩</div>
            <h2>Torus Embeddings</h2>
            <p>Interactive 3D visualization of graph embeddings on a torus.</p>
            <div class="btn-group">
                <a href="doughnut/" class="btn">Open Explorer</a>
            </div>
        </div>
    </main>

    <footer>
        Built with AI
    </footer>
</body>
</html>
