<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="donutGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Main torus body -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#donutGradient)" stroke-width="20" />
  <!-- Inner hole highlight/shadow for depth -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="50" cy="50" r="50" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.1" />
</svg>
